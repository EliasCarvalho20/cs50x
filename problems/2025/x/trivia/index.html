<!DOCTYPE html>

<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap"
        rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <title>Trivia!</title>
</head>
<body>
<div class="header">
  <h1>Trivia!</h1>
</div>

<div class="container">
  <div id="first-section" class="section">
    <h2>Part 1: Multiple Choice </h2>
    <hr>
    <h3>What is the biggest mammal in the world?</h3>
    <p id="feedback-msg-one"></p>
    <button class="options">Elephant</button>
    <button class="options">Blue Whale</button>
    <button class="options">Fin Whale</button>
  </div>

  <div class="section">
    <h2>Part 2: Free Response</h2>
    <hr>
    <h3>Which country in Europe shares a border with a country in South America?</h3>
    <p id="feedback-msg-two"></p>
    <label>
      <input id="input-answer" type="text">
    </label>
    <button id="check-answer">Check Answer</button>
  </div>
</div>
</body>
<script src="script.js"></script>
</html>
